name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build extension and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Builds the C++ extension via scikit-build-core (gcc + ninja on Linux).
      # --no-deps keeps CI lean: the engine tests only need numpy, not the
      # matplotlib / cartopy visualization stack.
      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --no-deps
          python -m pip install numpy pytest

      # Run from outside the repo root so `import python_sim` resolves to the
      # pip-installed package (with the compiled _core), not the un-built source
      # tree that would otherwise shadow it on sys.path.
      - name: Run tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -v
